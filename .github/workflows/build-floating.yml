name: Build GANZ X Floating Panel

on:
  workflow_dispatch:
  push:
    paths:
      - 'floating-android/**'
      - '.github/workflows/build-floating.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: floating-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GANZ-X-Floating-Panel
          path: floating-android/app/build/outputs/apk/debug/app-debug.apk
